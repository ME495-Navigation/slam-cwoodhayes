/**:
  ros__parameters:
    # 2x2 measurement covariance matrix (row-major)
    slam_R: [1.0, 0.0,
             0.0, 1.0]

    # 3x3 process covariance robot-pose block [theta, x, y] (row-major)
    # Landmark blocks are auto-filled with zeros in DDSLAM constructor
    slam_Q: [0.002, 0.0, 0.0,
             0.0, 0.001, 0.0,
             0.0, 0.0, 0.001]

    slam_n_max_landmarks: 30
    slam_new_landmark_variance: 100.0
    slam_mahalanobis_association_threshold: 0.21
    slam_mahalanobis_provisional_observation_count: 5

    # Landmark detection parameters
    detector:
      distance_threshold: 0.1
      rmse_threshold: 0.2
      inscribed_angle_mean_range_deg: [70.0, 140.0]
      inscribed_angle_stddev_threshold_deg: 20.0
      min_cluster_size: 8
      concavity_threshold: 0.01
      circle_radius_range: [0.03, 0.07]