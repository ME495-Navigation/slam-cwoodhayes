/**:
  ros__parameters:
    # 2x2 measurement covariance matrix (row-major)
    slam_R: [5.0, 0.0,
             0.0, 2.0]

    # 3x3 process covariance robot-pose block [theta, x, y] (row-major)
    # Landmark blocks are auto-filled with zeros in DDSLAM constructor
    slam_Q: [0.002, 0.0, 0.0,
             0.0, 0.001, 0.0,
             0.0, 0.0, 0.001]

    slam_n_max_landmarks: 10
    slam_new_landmark_variance: 1000.0

    # Landmark detection parameters
    detector:
      distance_threshold: 0.03
      rmse_threshold: 0.1
      inscribed_angle_mean_range_deg: [90.0, 130.0]
      inscribed_angle_stddev_threshold_deg: 10.0